# version: v1.2 (no heredocs; uses jq for Discord payload)
name: TCP Auto Clock (minimal)

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes UTC
  workflow_dispatch:        # allow manual runs

permissions:
  contents: write

concurrency:
  group: tcp-autoclock
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pyyaml jq
          python -m playwright install chromium

      - name: Run auto_clock.py
        id: runbot
        env:
          TCP_URL: ${{ secrets.TCP_URL }}
          TCP_USERNAME: ${{ secrets.TCP_USERNAME }}
          TCP_PASSWORD: ${{ secrets.TCP_PASSWORD }}
          TCP_ON: ${{ vars.TCP_ON }}
        run: |
          set -e
          python auto_clock.py || true
          echo "status=$(tr -d '\r' < run_status.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit state changes (if any)
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update state/skip (CI)"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ steps.runbot.outputs.status }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK secret set; skipping Discord."
            exit 0
          fi
          NOW_UTC="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          CONTENT="**TCP Auto Clock**\n$STATUS\n$NOW_UTC"
          PAYLOAD="$(jq -n --arg content "$CONTENT" '{content: $content}')"
          curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK" >/dev/null 2>&1 || true
