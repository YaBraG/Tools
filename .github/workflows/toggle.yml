name: 🔘 Master Toggle

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Turn scheduling ON or OFF"
        required: true
        type: choice
        options: ["on","off"]

permissions:
  contents: write   # we commit ON.flag
  actions: read

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write ON.flag
        id: writeflag
        run: |
          if [ "${{ github.event.inputs.mode }}" = "on" ]; then echo 1 > ON.flag; else echo 0 > ON.flag; fi
          echo "VAL=$(cat ON.flag)" >> $GITHUB_OUTPUT

      - name: Commit toggle file
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ON.flag
            git commit -m "Set ON.flag to $(cat ON.flag)"
            git push
          fi

      - name: Discord notify
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VAL: ${{ steps.writeflag.outputs.VAL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then exit 0; fi
          TS=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          CONTENT="**TCP Toggle**\nON.flag set to: $VAL\n$TS"
          curl -s -H "Content-Type: application/json" \
               -X POST \
               -d "$(jq -n --arg content "$CONTENT" '{content: $content}')" \
               "$DISCORD_WEBHOOK" >/dev/null 2>&1 || true
