name: Toggle TCP_ON

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Turn scheduling ON or OFF"
        required: true
        type: choice
        options: [ "on", "off" ]

permissions:
  actions: write   # required to manage repo variables
  contents: read

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Set repo variable TCP_ON (update or create)
        id: setvar
        uses: actions/github-script@v7
        with:
          script: |
            const mode = core.getInput('mode');
            const val = mode === 'on' ? '1' : '0';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const name = 'TCP_ON';

            // Try to update first (PATCH). If it doesn't exist, create (PUT).
            try {
              await github.request('PATCH /repos/{owner}/{repo}/actions/variables/{name}', {
                owner, repo, name, value: val
              });
            } catch (e) {
              if (e.status === 404) {
                await github.request('PUT /repos/{owner}/{repo}/actions/variables/{name}', {
                  owner, repo, name, value: val
                });
              } else {
                throw e;
              }
            }

            core.setOutput('val', val);

      - name: Discord notify
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VAL: ${{ steps.setvar.outputs.val }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No DISCORD_WEBHOOK; skipping Discord notification."
            exit 0
          fi
          TS=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          MSG="**TCP Toggle**%0ATCP_ON set to: $VAL%0A$TS"
          curl -s -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\":\"$MSG\"}" \
               "$DISCORD_WEBHOOK" >/dev/null 2>&1 || true
