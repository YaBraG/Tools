[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tools-desktop"
description = "A Windows-only Python and PySide6 desktop launcher for local utilities."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "YaBraG" }]
keywords = ["desktop", "pyside6", "launcher", "windows", "tools"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
dependencies = [
    "certifi>=2024.0.0",
    "Pillow>=11,<12",
    "PySide6>=6.7,<7",
    "PyMuPDF>=1.26,<2",
    "pypdf>=5,<6",
]

[project.urls]
Repository = "https://github.com/YaBraG/Tools"
Releases = "https://github.com/YaBraG/Tools/releases"

[project.optional-dependencies]
packaging = [
    "pyinstaller>=6.6,<7",
]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*", "shared*", "tools*"]

[tool.setuptools.package-data]
"tools" = ["*/manifest.json"]
