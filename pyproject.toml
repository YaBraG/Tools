[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tools-desktop"
version = "0.1.0"
description = "A Windows-only Python and PySide6 desktop launcher for local utilities."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "YaBraG" }]
keywords = ["desktop", "pyside6", "launcher", "windows", "tools"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]
dependencies = [
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
packaging = [
    "pyinstaller>=6.6,<7",
]

[tool.setuptools]
packages = [
    "app",
    "app.core",
    "app.ui",
    "app.ui.widgets",
    "shared",
    "tools",
    "tools.file_renamer",
    "tools.image_converter",
]

[tool.setuptools.package-data]
"tools.file_renamer" = ["manifest.json"]
"tools.image_converter" = ["manifest.json"]

